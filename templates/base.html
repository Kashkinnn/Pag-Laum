<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pag-Laum{% endblock %}</title>
    <style>
        :root {
            --primary: #2f6f5e;
            --primary-dark: #235347;
            --primary-light: #e8f3ef;
            --bg: #f0f5f3;
            --text-main: #1f2937;
            --text-muted: #64748b;
            --danger: #b00020;
            --danger-bg: #fde8e8;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }
        .container {
            max-width: 400px;
            margin: 80px auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary);
        }
        form p {
            margin: 12px 0;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button, .btn {
            display: inline-block;
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .link-row {
            text-align: center;
            margin-top: 16px;
        }
        .errorlist {
            color: var(--danger);
            font-size: 14px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block page_wrapper %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}
</body>
</html>
